<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Ulta he Krega</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #231F20;">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1" style="width: 100%; height: 100%; object-fit: contain; background: #231F20; display: block;"></canvas>
    <script src="Build/TemplateData.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.addEventListener("click", function() { canvas.focus(); window.focus(); });
      window.addEventListener("load", function() { canvas.focus(); });

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

        function requestMobileFullscreenLandscape() {
          var el = document.documentElement;
          var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
          if (rfs && !document.fullscreenElement) {
            rfs.call(el).then(function() {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(){});
              }
            }).catch(function(){});
          } else if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function(){});
          }
        }

        window.addEventListener('touchstart', function() {
          requestMobileFullscreenLandscape();
        }, { passive: true });
        window.addEventListener('click', function() {
          requestMobileFullscreenLandscape();
        });
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/TemplateData.data.br",
        frameworkUrl: "Build/TemplateData.framework.js.br",
        codeUrl: "Build/TemplateData.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Ulta he Krega",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
